name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.7
          name: 'MaoneArt Keuangan v1.0.7 (Release)'
          body: |
            ## 💰 MaoneArt Keuangan - Android Release APK (v1.0.7)
            
            - **Integrasi Penuh Saldo Awal Tabungan & Pemotongan Saldo Kas Real-Time**:
              * Pembuatan target tabungan dengan Saldo Awal kini memvalidasi ketersediaan saldo kas utama. Jika saldo kas kosong atau kurang dari saldo awal, sistem menolak dan menampilkan peringatan saldo tidak cukup.
              * Setiap pembuatan target dengan saldo awal otomatis dicatat sebagai Pengeluaran (*Investasi & Tabungan*) yang memotong Saldo Kas riil di SQLite.
              * Begitu juga setoran tabungan harian memotong Saldo Kas utama.
            - **Floating Action Button (FAB) Konsisten di Layar Hutang & Tabungan**:
              * Layar Hutang & Piutang dilengkapi tombol melayang `+ Catat Hutang / Piutang`.
              * Layar Tabungan Impian dilengkapi tombol melayang `+ Buat Target Impian`.
              * Konsisten dan seragam dengan tombol `+ Catat Transaksi` di Layar Transaksi.
            - **100% Bebas Tertutup Navbar Sistem**: Seluruh tombol aksi modal dan list view aman dari bilah 3-tombol sistem HP.
            - **100% Offline SQLite Storage**: Data tersimpan lokal di HP tanpa server.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
