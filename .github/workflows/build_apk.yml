name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.2
          name: 'MaoneArt Keuangan v1.0.2 (Release)'
          body: |
            ## 💰 MaoneArt Keuangan - Android Release APK (v1.0.2)
            
            - **Sinkronisasi Real-Time Gemini API Key**:
              * Kunci API yang dimasukkan di mana pun (baik dari menu Pengaturan maupun ikon kunci di Chat AI) kini 100% tersinkronisasi otomatis secara global di seluruh aplikasi.
            - **Halaman Tutorial Cara Membuat API Key Gemini (100% Gratis)**:
              * Panduan visual 5 langkah lengkap cara mendapatkan API Key resmi dari Google AI Studio.
              * Tombol akses langsung untuk membuka website Google AI Studio dan menyalin link.
            - **Dukungan Penuh Universal Kunci Gemini**:
              * Mendukung format kunci klasik `AIzaSy...` maupun format otentikasi baru `AQ.Ab...`.
            - **Smart AI Financial Assistant (Chat Curhat Keuangan)**:
              * Menu Chat AI di tengah navbar, analisis curhat pengeluaran/pemasukan, dan tombol 1 klik simpan ke SQLite.
            - **100% Bebas Tertutup Navbar Sistem & 100% Offline SQLite Storage**.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
