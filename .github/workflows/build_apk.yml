name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.5
          name: 'MaoneArt Keuangan v1.0.5 (Release)'
          body: |
            ## 💰 MaoneArt Keuangan - Android Release APK (v1.0.5)
            
            - **Format Nominal Otomatis (*Real-Time Thousand Separator*)**:
              * Saat mengetik angka nominal di seluruh form transaksi, hutang, dan tabungan, angka otomatis diberi tanda pemisah titik (.) ribuan secara langsung (misal: ketik `1000000` langsung menjadi `1.000.000`).
            - **Tampilan Hutang & Piutang 100% Identik dengan www/Keuangan/hutang.php**:
              * Header Navigasi *Debt & Credit Manager* dengan Segmented Toggle `Hutang Saya` & `Piutang (Di Orang)`.
              * Kartu Ringkasan Berdampingan `TOTAL HUTANG SAYA` (Merah) vs `TOTAL PIUTANG SAYA` (Hijau).
              * Filter Status Pills: `Belum Lunas`, `Lunas`, `Semua Data`.
              * Kartu item dengan tag kategori pill (`💳 Kartu Kredit`, `🏦 Pinjaman Bank`, `👤 Perorangan`, dll), badge `LUNAS` / `Belum Lunas`, Progress Bar cicilan, dan tombol aksi `Bayar Cicilan`, `Log Cicilan`, dan Hapus.
            - **Bebas Total Bug Navbar Overlap**:
              * Bottom safe-padding ditingkatkan hingga **+160px** di seluruh layar (Transaksi, Kategori, Tabungan, Hutang, Laporan), memastikan tidak ada satupun item atau tombol yang tertutup bilah navigasi ponsel atau floating action button.
            - **100% Offline SQLite Storage**: Data tersimpan aman di internal HP tanpa server atau internet.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
