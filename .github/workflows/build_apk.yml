name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.3.0
          name: 'MaoneArt Keuangan v1.3.0 (Release)'
          body: |
            ## 💰 MaoneArt Keuangan - Android Release APK (v1.3.0)
            
            - **Perbaikan Total Sinkronisasi Kategori (Fix Primary Key Constraint Crash)**:
              - Mengatasi error `UNIQUE constraint failed: kategori.id` dengan atomic `INSERT OR REPLACE` SQLite master reconciliation.
              - Penyelarasan 2 arah kategori Web (MySQL phpMyAdmin) dan APK (SQLite) 100% konsisten.
              - Kategori yang dihapus di Web otomatis terhapus di APK tanpa duplikasi / resurrecting.
              - Real-time endpoint `/api/kategori.php` terintegrasi untuk penambahan & penghapusan kategori.
              - Modal konfirmasi hapus kategori Glassmorphism standar MaoneArt.
            - **Sinkronisasi 2 Arah Master Web & APK Real-time**:
              - Rekonsiliasi atomic data MySQL sebagai master source of truth.
              - Hapus data transaksi langsung sinkron tanpa delay / duplikasi.
              - Filter 'Semua' menampilkan seluruh riwayat secara akurat.
              * Mutex sync lock mencegah race condition saat sinkronisasi background.
              * Batch atomic save untuk AI Chat Assistant 1-klik simpan.
              * Deduplikasi otomatis di SQLite lokal dan MySQL phpMyAdmin.
            - **Sistem Peringatan Jatuh Tempo & Indikator Aman Bulanan**:
              * Indikator **"Bulan Ini Aman ✅"** otomatis aktif jika cicilan bulan berjalan sudah dibayar.
              * Indikator **"Lewat Jatuh Tempo ⚠️"** dan banner peringatan merah jika lewat tanggal jatuh tempo.
            - **Kalkulator Cicilan & Tenor Otomatis (Smart Installment)**.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
