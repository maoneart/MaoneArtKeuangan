name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.4
          name: 'MaoneArt Keuangan v1.0.4 (Release)'
          body: |
            ## 💰 MaoneArt Keuangan - Android Release APK (v1.0.4)
            
            - **Intro & Panduan Onboarding 4 Slide (Saat Pertama Kali Install)**:
              * **Slide 1**: Cara Penggunaan Smart AI Financial Assistant (Curhat Keuangan & Catat Otomatis).
              * **Slide 2**: Pencatatan Arus Kas Harian, Hutang Piutang & Tabungan Impian Cerdas.
              * **Slide 3**: Keunggulan Aplikasi 100% Offline SQLite, Tanpa Iklan & Privasi Terjaga.
              * **Slide 4**: Profil Aplikasi & Pengembang (**Hermawan**, MaoneArt Keuangan v1.0.4).
              * Dapat dibuka kembali kapan saja via menu Pengaturan -> *Lihat Panduan & Intro Aplikasi*.
            - **Pencatatan Lengkap AI**: Arus Kas, Hutang, Piutang, Target Tabungan & Setoran.
            - **Sinkronisasi Real-Time Global API Key**.
            - **100% Bebas Tertutup Navbar Sistem & 100% Offline SQLite Storage**.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
