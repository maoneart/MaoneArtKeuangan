name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.1
          name: 'MaoneArt Keuangan v1.0.1 (Release)'
          body: |
            ## 💰 MaoneArt Keuangan - Android Release APK (v1.0.1)
            
            - **Fitur Baru: Smart AI Financial Assistant (Chat Curhat Keuangan)**:
              * Menu Chat AI diletakkan tepat di tengah bilah navigasi bawah (antara Transaksi dan Laporan).
              * Ceritakan pengeluaran atau pemasukan Anda secara santai (misal: *"Tadi makan nasi padang 25rb dan beli bensin 30rb"*), AI otomatis menganalisis dan mendeteksi seluruh transaksi dengan kategori yang sesuai.
              * Tombol aksi **`[+ Simpan ke Catatan Keuangan]`** langsung mencatat transaksi ke database SQLite dalam 1 klik!
            - **Integrasi Google Gemini AI di Menu Pengaturan**:
              * Form input API Key Gemini (berawalan `AIzaSy...`) di menu Pengaturan dengan indikator status aktif.
              * API Key tersimpan 100% aman di penyimpanan internal HP Anda (tidak diunggah ke internet atau repo GitHub).
            - **Penataan Navbar 5 Tab Sempurna**:
              * `Beranda`, `Transaksi`, `Chat AI` (Tengah), `Laporan`, `Pengaturan`.
            - **100% Bebas Tertutup Navbar Sistem**:
              * Safe area adaptif di seluruh modal dan form input di atas bilah 3-tombol sistem HP.
            - **100% Offline SQLite Storage**:
              * Data tersimpan aman di internal HP tanpa server pihak ketiga.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
