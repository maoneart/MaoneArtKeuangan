name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.8
          name: 'MaoneArt Keuangan v1.0.8 (Release)'
          body: |
            ## 💰 MaoneArt Keuangan - Android Release APK (v1.0.8)
            
            - **Redesain 100% Layar Tabungan Impian (Identik www/Keuangan/tabungan.php)**:
              * Header *Savings & Target Goals* dengan subteks rapi.
              * 2 Kartu Ringkasan Berdampingan (*Dual Summary Cards*): `TOTAL TABUNGAN TERKUMPUL` (Hijau `#059669`) vs `TARGET TABUNGAN AKTIF` (Biru `#0047CC`).
              * Filter Status Pills: `Berlangsung`, `Tercapai 🎉`, `Semua Target`.
              * Kartu item impian lengkap dengan badge status `TERCAPAI 🎉` / `Berlangsung`, tanggal target selesai, progress bar persentase, serta tombol `Setor Tabungan`, `Log Setoran`, dan Hapus.
            - **Integrasi Penuh Saldo Awal Tabungan & Pemotongan Saldo Kas Real-Time**:
              * Pembuatan target tabungan dengan Saldo Awal memvalidasi ketersediaan saldo kas utama (mencegah menabung jika saldo kosong / tidak cukup).
              * Saldo Awal otomatis dicatat sebagai Pengeluaran (*Investasi & Tabungan*) yang memotong Saldo Kas riil di SQLite.
              * Setoran tabungan berkala otomatis memotong Saldo Kas utama.
            - **Floating Action Button (FAB) Konsisten di Semua Layar**:
              * Layar Transaksi: `+ Catat Transaksi`
              * Layar Hutang & Piutang: `+ Catat Hutang / Piutang`
              * Layar Tabungan Impian: `+ Buat Target Impian`
            - **100% Bebas Tertutup Navbar Sistem**: Seluruh tombol aksi modal dan list view aman dari bilah 3-tombol sistem HP.
            - **100% Offline SQLite Storage**: Data tersimpan lokal di HP tanpa server.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
