name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.6
          name: 'MaoneArt Keuangan v1.0.6 (Release)'
          body: |
            ## 💰 MaoneArt Keuangan - Android Release APK (v1.0.6)
            
            - **Perbaikan Total Tombol Modal & Navbar Sistem (100% Bebas Tertutup Navbar)**:
              * Seluruh input modal bottom sheet (`QuickAddModal`, `AddDebtModal`, `PayDebtModal`, `AddSavingModal`, `DepositSavingModal`, `AddCategoryModal`) kini menggunakan `useSafeArea: true` dan container `SafeArea` dengan margin keyboard dinamis. Tombol aksi bawah (Simpan Transaksi, Simpan Impian, dll) selalu tampil utuh dan aman di atas bilah 3-tombol sistem HP.
            - **Kotak Input Nominal Mewah & Simetris (*Symmetrical FinTech Rp Input*)**:
              * Teks `Rp` selalu otomatis muncul secara permanen dengan tata letak simetris dan rapi.
              * Real-Time Thousand Separator otomatis memformat angka ribuan bertitik (`1.000.000`).
            - **Integrasi Cepat App Features & All Categories**:
              * Mengklik kotak kategori di *APP FEATURES* (Beranda) atau *Kelola Kategori* akan langsung membuka modal transaksi dengan kategori tersebut terpilih secara otomatis.
            - **Redesain & Perapian Grafik Batang (*FL BarChart*)**:
              * Judul dan legenda `🟢 Pemasukan` & `🔴 Pengeluaran` dipisahkan secara rapi sehingga tidak bertumpuk.
              * Lebar label sumbu Y (*reservedSize: 64*) diperluas sehingga teks `Rp 1,25 jt` dan `Rp 500 rb` muat 1 baris tanpa terpotong.
              * Batang grafik lebih proporsional dengan gridlines horizontal putus-putus.
            - **100% Offline SQLite Storage**: Data tersimpan lokal di HP tanpa server.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
