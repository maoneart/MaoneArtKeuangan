name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "raw_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: ${{ steps.app_version.outputs.version }}
          name: 'MaoneArt Keuangan ${{ steps.app_version.outputs.version }} (Release)'
          body: |
            ## 💰 MaoneArt Keuangan ${{ steps.app_version.outputs.version }} - Android Release APK
            
            Versi terbaru aplikasi MaoneArt Keuangan dengan koneksi cloud hosting otomatis dan update in-place mulus 1 key!
            
            ### ✨ Fitur Baru di Versi ${{ steps.app_version.outputs.version }}:
            - 🔑 **Permanent Release Keystore (1 Key Update Mulus)**: Tanda tangan digital permanen sama seperti MaoneArt Music (`upload-keystore.jks`), sehingga update berikutnya bisa langsung ditimpa (*in-place update*) tanpa perlu uninstall lagi!
            - ☁️ **Koneksi Cloud Hosting Otomatis**: Endpoint otomatis tersambung ke `https://api.maoneart.my.id/keuangan/api` di shared hosting JagoanHosting (`maonear1_keuangan`). Bebas repot isi URL manual di Pengaturan.
            - 🔄 **Sinkronisasi 2 Arah Penuh (Bidirectional)**: Data transaksi, hutang/cicilan, dan tabungan otomatis saling backup antara HP dan server.
            - 🛡️ **Proteksi Anti Duplikasi**: Aman dari data tabrakan atau ganda meski lupa sinkronisasi.
            - ⚡ **Offline-First SQLite**: Aplikasi tetap cepat dan bisa mencatat transaksi meski tanpa koneksi internet.
            
            📥 **Download berkas APK di bawah ini dan instal langsung di perangkat Android Anda!**
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
