name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.4
          name: 'MaoneArt Keuangan v1.0.4 (Release)'
          body: |
            ## 💰 MaoneArt Keuangan - Android Release APK (v1.0.4)
            
            - **Desain & Konsep Sesuai www/Keuangan (BuildWithAngga Royal Blue & Clean Plus Jakarta Sans)**:
              * Header Royal Blue Gradient (`#002680` -> `#0047cc` -> `#0056fb`) dengan logo resmi MaoneArt.
              * 4 Tombol Cepat Glassmorphic di Header: `Top Up` (+ Pemasukan), `Bayar` (- Pengeluaran), `Hutang` (Hutang & Piutang), `Tabungan` (Tabungan Impian).
              * Grid 8 Kategori Unggulan (*APP FEATURES*) dengan wadah warna pastel modern.
              * Daftar Transaksi (*LAST TRANSACTION*) dengan kartu putih bersih, ikon kategori pastel, dan tanggal Indonesia.
            - **Integrasi Logo Resmi**:
              * Menggunakan logo resmi di Header Aplikasi dan Ikon Launcher APK.
            - **Integrasi Saldo Kas & Validasi Pelunasan Real-Time**:
              * Pelunasan / Cicilan Hutang wajib memvalidasi saldo kas (mencegah pelunasan jika saldo tidak cukup).
              * Pembayaran hutang otomatis memotong saldo kas (pengeluaran).
              * Penerimaan piutang otomatis menambah saldo kas (pemasukan).
              * Setoran tabungan otomatis memotong saldo kas utama.
            - **Grafik Batang (*FL BarChart*) & Grafik Lingkaran (*FL PieChart*)**: Visualisasi Arus Kas Mingguan dan proporsi kategori interaktif.
            - **Bebas Bug Navbar**: Dilengkapi `SafeArea` dan padding aman di semua layar ponsel.
            - **100% Offline SQLite Storage**: Data tersimpan aman di internal HP tanpa perlu server atau kuota internet.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
