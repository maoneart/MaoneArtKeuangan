name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.9
          name: 'MaoneArt Keuangan v1.0.9 (Release)'
          body: |
            ## 💰 MaoneArt Keuangan - Android Release APK (v1.0.9)
            
            - **Perbaikan Ikon Tombol Aksi (Bayar Cicilan, Terima Pembayaran, Setor Tabungan)**:
              * Ikon tombol `Bayar Cicilan` dan `Terima Pembayaran` kini diberi warna putih solid (*pure white*) yang terang dan tegas sehingga selalu terlihat jelas dan tidak menyatu dengan background.
              * Ikon tombol `Setor Tabungan` dan `Log Setoran` diperjelas dengan ikon kontras tinggi.
            - **Koleksi Super Lengkap Ikon Kategori Baru (40+ Ikon)**:
              * **Keagamaan & Sosial**: Sedekah & Infaq (🤲), Tahlil & Pengajian (📖), Zakat & Masjid (🕌), Sosial & Keluarga (👥).
              * **Pajak & Finansial**: Pajak & Retribusi (🧾), Bank & Bunga (🏦), Investasi & Emas (🪙), Saham & Trading (📈).
              * **Kendaraan & Utilitas**: Bensin & SPBU (⛽), Servis & Bengkel (🔧), Motor (🛵), Mobil (🚗), Listrik & Token (⚡), Air PDAM (💧), Wifi & Internet (📶), Pulsa (📱).
              * **Belanja, Kesehatan & Pendidikan**: Pasar/Warung (🏪), Belanja (🛒), Rumah (🏠), SPP & Sekolah (🎓), Rumah Sakit & Dokter (🏥), Obat & Farmasi (💊), Anak & Balita (👶), dll.
            - **100% Bebas Tertutup Navbar Sistem**: Seluruh tombol aksi modal dan list view aman dari bilah 3-tombol sistem HP.
            - **100% Offline SQLite Storage**: Data tersimpan lokal di HP tanpa server.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
