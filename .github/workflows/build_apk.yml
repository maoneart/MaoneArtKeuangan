name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: 'MaoneArt Keuangan v1.0.0 (Official Final Release)'
          body: |
            ## 💰 MaoneArt Keuangan - Android Official Release APK (v1.0.0)
            
            - **Halaman Pengaturan & Tentang Aplikasi (About MaoneArt Keuangan)**:
              * Menu Pengaturan & Tentang Aplikasi lengkap dengan identitas branding, informasi fitur unggulan, status privasi lokal 100% SQLite offline, dan profil pengembang MaoneArt 2026.
            - **Pencatatan Arus Kas & Saldo Kas Cerdas**:
              * Format angka ribuan otomatis (*Real-Time Thousand Separator*), input box simetris dengan label `Rp` tebal.
              * Kalkulasi saldo kas riil terintegrasi penuh dengan hutang piutang dan tabungan impian.
            - **Debt & Credit Manager (Hutang & Piutang)**:
              * Segmented Switcher Hutang Saya vs Piutang, tombol aksi jelas `Bayar Cicilan` & `Terima Pembayaran`, progres pelunasan dan modal riwayat pembayaran.
            - **Savings & Target Goals (Tabungan Impian)**:
              * Redesain lengkap dual summary cards (`TOTAL TABUNGAN TERKUMPUL` vs `TARGET TABUNGAN AKTIF`), filter status, validasi saldo kas saat pengisian saldo awal, dan modal log setoran berkala.
            - **40+ Koleksi Ikon Kategori Lengkap**:
              * Sedekah, Infaq, Tahlil, Doa, Pajak, SPP, Servis Kendaraan, Zakat, Listrik, Wifi, Belanja, Medis, dsb.
            - **Grafik Batang & Lingkaran Visual Rapi**:
              * Diagram Pie Interaktif dan Bar Chart Mingguan dengan legenda terpisah dan reserved label yang proporsional.
            - **100% Bebas Tertutup Navbar Sistem**:
              * Safe area adaptif di seluruh modal dan form input di atas bilah 3-tombol sistem HP.
            - **100% Offline SQLite Storage**:
              * Data tersimpan aman di internal HP tanpa koneksi internet atau server pihak ketiga.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
