name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.3
          name: 'MaoneArt Keuangan v1.0.3 (Release)'
          body: |
            ## 💰 MaoneArt Keuangan - Android Release APK (v1.0.3)
            
            - **Integrasi Saldo Kas & Pelunasan Hutang Piutang Real-Time**:
              * Pelunasan / Cicilan Hutang wajib memvalidasi saldo kas. Jika saldo kosong / tidak mencukupi, sistem mencegah transaksi dan menampilkan peringatan.
              * Setiap pembayaran hutang otomatis dicatat sebagai Pengeluaran yang mengurangi Saldo Kas.
              * Setiap penerimaan piutang otomatis dicatat sebagai Pemasukan yang menambah Saldo Kas.
              * Setoran tabungan impian otomatis memotong Saldo Kas utama.
            - **Redesain Mewah Layar Hutang & Piutang**:
              * Hero Card Dual-Metric Total Hutang vs Total Piutang dengan Cyber-Glow Neon Accent.
              * Progress Bar Pelunasan interaktif per orang/pihak.
              * Badge status pintar (`LUNAS 🎉` & Sisa Tenggat Waktu).
            - **Perbaikan Menyeluruh UI Bug Navbar & FAB Overlap**:
              * Menambahkan `SafeArea` dan kalkulasi *dynamic bottom safe-padding* (+120px) pada SEMUA layar (Transaksi, Kategori, Tabungan, Hutang, Laporan, dan Beranda). Item terbawah 100% bebas dari tertutup bilah navigasi bawaan ponsel.
            - **Grafik Batang (*FL BarChart*) & Grafik Lingkaran (*FL PieChart*)**: Visualisasi Arus Kas Mingguan dan proporsi kategori pengeluaran interaktif.
            - **100% Offline SQLite Storage**: Data tersimpan aman di internal HP tanpa perlu server atau kuota internet.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
