name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.6
          name: 'MaoneArt Keuangan v1.1.6 (Release)'
          body: |
            ## 💰 MaoneArt Keuangan - Android Release APK (v1.1.6)
            
            - **Perbaikan Mode Landscape & Sidebar Navigasi**:
              * Sidebar kiri kini tampil dengan tema *High-Contrast Deep Navy Glassmorphism* yang jelas, tajam, dan elegan.
              * Perhitungan lebar sidebar dinamis (`railContentWidth + safePadding.left`), mencegah sidebar terpotong / hilang akibat *notch* atau kamera *punch-hole* samping HP.
              * Pill navigasi aktif dengan gradasi Royal Blue bercahaya (*glow shadow*) dan ikon/teks kontras tinggi.
              * Area konten kanan aman dari *camera notch / gesture insets* kanan.
              * Dukungan penuh mode Landscape & Portrait di semua halaman.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
