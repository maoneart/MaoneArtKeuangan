name: Build MaoneArt Keuangan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Keuangan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.2.1
          name: 'MaoneArt Keuangan v1.2.1 (Release)'
          body: |
            ## 💰 MaoneArt Keuangan - Android Release APK (v1.2.1)
            
            - **Sistem Peringatan Jatuh Tempo & Indikator Aman Bulanan**:
              * Indikator **"Bulan Ini Aman ✅"** otomatis aktif jika cicilan bulan berjalan sudah dibayar sebelum/pada tanggal jatuh tempo.
              * Indikator **"Lewat Jatuh Tempo ⚠️"** dan banner peringatan merah otomatis muncul jika tanggal jatuh tempo bulan berjalan sudah lewat dan belum dicicil.
              * Indikator **"Jatuh Tempo H-X ⏳"** saat mendekati tanggal jatuh tempo.
            - **Kalkulator Cicilan & Tenor Otomatis (Smart Installment)**:
              * Pilihan tenor fleksibel (misal: 33 bulan) dengan kalkulasi otomatis cicilan per bulan dan estimasi bulan lunas.
              * Pengaturan jadwal jatuh tempo tagihan bulanan berulang (misal: Tiap tanggal 15 setiap bulan sampai lunas).
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
