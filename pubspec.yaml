name: maoneart_keuangan
description: "MaoneArt Keuangan - Aplikasi Pencatatan Keuangan, Arus Kas, Hutang Piutang & Tabungan Impian Cerdas berbasis Flutter & SQLite Offline"
publish_to: 'none'
version: 1.1.9+20

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & HTTP for Gemini AI
  http: ^1.2.2
  url_launcher: ^6.3.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Local SQLite Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Interactive Charts & Graphs
  fl_chart: ^0.68.0

  # Formatting & Localization (IDR Rupiah & Dates)
  intl: ^0.19.0

  # PDF & Excel/CSV Export
  pdf: ^3.11.1
  printing: ^5.13.2
  csv: ^6.0.0
  share_plus: ^10.0.0
  open_filex: ^4.5.0

  # Storage & Preferences
  shared_preferences: ^2.3.2
  uuid: ^4.4.0

  # UI Design System & Typography
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0047CC"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
